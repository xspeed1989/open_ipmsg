[package]
name = "open-ipmsg"
version = "0.1.5"
description = "跨平台 IP Messenger 客户端（Tauri v2，仿微信PC界面）"
authors = ["allen"]
edition = "2021"

[lib]
name = "open_ipmsg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

# Linux：WebKitGTK 不把文件类剪贴板内容暴露给网页（复制文件后 clipboardData 是空的），
# 只能直接读 GTK 剪贴板拿 text/uri-list。版本跟随 tauri already-vendored 的传递依赖。
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
# ksni：Linux 下自实现 StatusNotifierItem（libappindicator 收不到点击事件）。
# 必须用 async-io 而非默认的 tokio 特性：Cargo 会做特性合并，一旦 zbus 打开 tokio，
# notify-rust 的 show() 就会走「新建多线程运行时再 block_on」的实现，
# 从 Tauri 命令所在的 tokio worker 上调用会 panic（Cannot start a runtime from within a runtime）
ksni = { version = "0.3.6", default-features = false, features = ["async-io"] }
# 原生可点击通知：tauri-plugin-notification 没有「点击通知」回调（点了没反应），
# 消息通知改由 notify-rust 直发 DBus，把点击（正文/「打开」按钮）转成 open-chat 事件。
# 版本与默认特性跟随传递依赖（zbus + async-io，与 ksni 一致），不引入新的运行时
notify-rust = "4.18"

# Windows 下枚举 IPv6 网卡及接口索引，用于逐接口加入/发送 IPMsg 组播；
# 截图抓屏走 GDI BitBlt（Graphics_Gdi + UI_WindowsAndMessaging 取虚拟桌面尺寸）。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS 下抓屏走 CoreGraphics（CGDisplayCreateImage 逐屏抓取后拼接）。
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.3"
# 右键复制消息内容用：WebKitGTK 的网页剪贴板 API 不可靠，走原生插件
tauri-plugin-clipboard-manager = "2"
# 全局热键（截图）：Windows / macOS / X11 走插件；Wayland 走 portal（见 shortcut.rs）
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
# 官方 IPMsg v4.5+ 的聊天记录是 SQLite 库（ipmsg.db），导入用；
# bundled：静态编译自带 sqlite3，用户机器无需安装
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "fs",
    "io-util",
] }
encoding_rs = "0.8"
local-ip-address = "0.6"
hostname = "0.4"
tauri-plugin-single-instance = "2.4.3"
# 官方协议加密（spec §2）：RSA 会话钥交换 + AES/Blowfish 会话加密 + SHA 签名
rsa = "0.9"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
blowfish = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
# oid：PKCS#1 v1.5 签名需要 DigestInfo 前缀（SigningKey/VerifyingKey 要求 AssociatedOid）
sha2 = { version = "0.10", features = ["oid"] }
rand = "0.8"
# 自定义表情包的导入/导出容器：标准 zip（.ipmojis），只开 deflate，
# 复用已在依赖树里的 flate2，不引入 bzip2/zstd/aes 等额外编译成本
zip = { version = "2", default-features = false, features = ["deflate"] }

# 截图：Linux 抓屏走 xdg-desktop-portal（Wayland 下唯一可行路径）。
# 必须 default-features = false —— 一旦打开 zbus 的 tokio 特性，Cargo 的特性合并
# 会把 notify-rust 推回「新建运行时再 block_on」的实现，从 Tauri 命令所在的
# tokio worker 调用会 panic（见本文件 ksni / notify-rust 段落的同源注释）。
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# 抓屏结果的编解码：Linux 拿到的已是 PNG（只读尺寸），Windows/macOS 需要编码
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
net_debug = []
# macOS 透明遮罩（截图窗口不闪的那道保险）：**两处都要开，缺一不可** ——
#   1) `tauri.conf.json` 设 `"macOSPrivateApi": true`。注意 tauri-cli 会把它转成
#      **tauri 依赖的**特性去编译（实测打包命令走的就是
#      `cargo build --bins --features tauri/custom-protocol` 这个 dep/feature 套路），
#      所以只做这一步编译是干净的、看起来「已经启用」；
#   2) 还要用 **app crate 自己的**特性构建：`pnpm tauri build --features macos-private-api`
#      （或把本特性加进 `[features] default`）。`screenshot.rs` 的建窗 cfg 门判的是本
#      crate 的特性，只做 1) 的话它恒假、`transparent()` 根本不会被调用（**静默失效**）。
# 两处都做之前，macOS 的遮罩仍是不透明窗，「未绘制的白窗」那一帧还在。
# 维护者待办见 docs/superpowers/specs/2026-09-13-screenshot-design.md §15.5。
macos-private-api = ["tauri/macos-private-api"]

# tray-icon 0.24.x 在 Windows 用 CreateIcon 做「单色 mask + XOR」的经典图标，
# 没有真 alpha 通道：全 0 像素的透明帧会被任务栏画成黑块/马赛克（闪烁帧 bug）。
# 本地 vendor 一份，把 Windows 图标改成 CreateIconIndirect + DIB section 的
# 32 位 alpha 图标（Electron/Chromium nativeImage 同款做法），透明帧才真正透明。
# 改动仅限 vendor/tray-icon/src/platform_impl/windows/icon.rs。
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }

[profile.release]
strip = true
lto = true
codegen-units = 1
