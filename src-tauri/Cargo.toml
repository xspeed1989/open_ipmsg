[package]
name = "open-ipmsg"
version = "0.1.0"
description = "跨平台 IP Messenger 客户端（Tauri v2，仿微信PC界面）"
authors = ["allen"]
edition = "2021"

[lib]
name = "open_ipmsg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

# Linux：WebKitGTK 不把文件类剪贴板内容暴露给网页（复制文件后 clipboardData 是空的），
# 只能直接读 GTK 剪贴板拿 text/uri-list。版本跟随 tauri already-vendored 的传递依赖。
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
# ksni：Linux 下自实现 StatusNotifierItem（libappindicator 收不到点击事件）。
# 必须用 async-io 而非默认的 tokio 特性：Cargo 会做特性合并，一旦 zbus 打开 tokio，
# notify-rust 的 show() 就会走「新建多线程运行时再 block_on」的实现，
# 从 Tauri 命令所在的 tokio worker 上调用会 panic（Cannot start a runtime from within a runtime）
ksni = { version = "0.3.6", default-features = false, features = ["async-io"] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "fs",
    "io-util",
] }
encoding_rs = "0.8"
local-ip-address = "0.6"
hostname = "0.4"
tauri-plugin-single-instance = "2.4.3"

[features]
net_debug = []

[profile.release]
strip = true
lto = true
codegen-units = 1
