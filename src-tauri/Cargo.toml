[package]
name = "open-ipmsg"
version = "0.1.1"
description = "跨平台 IP Messenger 客户端（Tauri v2，仿微信PC界面）"
authors = ["allen"]
edition = "2021"

[lib]
name = "open_ipmsg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

# Linux：WebKitGTK 不把文件类剪贴板内容暴露给网页（复制文件后 clipboardData 是空的），
# 只能直接读 GTK 剪贴板拿 text/uri-list。版本跟随 tauri already-vendored 的传递依赖。
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
# ksni：Linux 下自实现 StatusNotifierItem（libappindicator 收不到点击事件）。
# 必须用 async-io 而非默认的 tokio 特性：Cargo 会做特性合并，一旦 zbus 打开 tokio，
# notify-rust 的 show() 就会走「新建多线程运行时再 block_on」的实现，
# 从 Tauri 命令所在的 tokio worker 上调用会 panic（Cannot start a runtime from within a runtime）
ksni = { version = "0.3.6", default-features = false, features = ["async-io"] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.3"
# 右键复制消息内容用：WebKitGTK 的网页剪贴板 API 不可靠，走原生插件
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
# 官方 IPMsg v4.5+ 的聊天记录是 SQLite 库（ipmsg.db），导入用；
# bundled：静态编译自带 sqlite3，用户机器无需安装
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "fs",
    "io-util",
] }
encoding_rs = "0.8"
local-ip-address = "0.6"
hostname = "0.4"
tauri-plugin-single-instance = "2.4.3"
# 官方协议加密（spec §2）：RSA 会话钥交换 + AES/Blowfish 会话加密 + SHA 签名
rsa = "0.9"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
blowfish = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
# oid：PKCS#1 v1.5 签名需要 DigestInfo 前缀（SigningKey/VerifyingKey 要求 AssociatedOid）
sha2 = { version = "0.10", features = ["oid"] }
rand = "0.8"

[features]
net_debug = []

[profile.release]
strip = true
lto = true
codegen-units = 1
